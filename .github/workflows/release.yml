name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      - name: Generate bundled assets
        run: node scripts/gen-art.mjs

      # macOS universal：tauri CLI 只对主程序做 lipo，辅助二进制需手动合并
      - name: Build extra bins (universal)
        if: matrix.platform == 'macos-latest'
        run: |
          cargo build --release --target aarch64-apple-darwin --bins
          cargo build --release --target x86_64-apple-darwin --bins
          mkdir -p src-tauri/target/universal-apple-darwin/release
          for bin in pet-bridge nekode-codex-shim; do
            lipo -create -output "src-tauri/target/universal-apple-darwin/release/$bin" \
              "src-tauri/target/aarch64-apple-darwin/release/$bin" \
              "src-tauri/target/x86_64-apple-darwin/release/$bin"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nekode ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
